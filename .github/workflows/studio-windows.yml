name: Aegaea Studio (Windows)
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Commit formatter-only changes to feature branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        shell: pwsh
        run: |
          git add studio/src
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "style: apply rustfmt to studio source"
          git push origin HEAD:${{ github.ref_name }}
      - name: Format validation
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Export native Aegaea cartographic maps
        run: cargo run -p aegaea-studio -- --export-maps maps/aegaea
      - name: Build derived numeric maps from example graph
        run: cargo run -p aegaea-studio -- --build-graph docs/examples/aegaea-map-graph.json maps/derived
      - name: Validate geospatial category consistency
        run: cargo run -p aegaea-studio -- --diagnose-world maps/diagnostics/geology-consistency.json
      - name: Publish source consistency report
        uses: actions/upload-artifact@v4
        with:
          name: aegaea-geology-diagnostics
          path: maps/diagnostics
          retention-days: 14
      - name: Publish graph field outputs
        uses: actions/upload-artifact@v4
        with:
          name: aegaea-derived-fields
          path: maps/derived
          retention-days: 14
      - name: Generate new terrain from geological inputs (no old elevation dependency)
        run: cargo run -p aegaea-studio -- --generate-terrain maps/geology-generated
      - name: Publish generated terrain and scientific provenance
        uses: actions/upload-artifact@v4
        with:
          name: aegaea-generated-terrain-v1
          path: maps/geology-generated
          retention-days: 14
      - name: Publish map previews from native data
        uses: actions/upload-artifact@v4
        with:
          name: aegaea-native-maps
          path: maps/aegaea
          retention-days: 14
