[package]
name = "aegaea-studio"
version = "0.1.0"
edition = "2021"
description = "Aegaea physical-world cartography studio desktop foundation"
publish = false

[dependencies]
eframe = { version = "0.32.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
# eframe's wgpu feature alone does not compile native graphics backends.
# Enable Windows DX12 and Vulkan explicitly so wgpu::Instance can start.
wgpu = { version = "25.0", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
